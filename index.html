<html lang="en">

<head>
  <title>Archivist mapping files generator</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="jszip.min.js"></script>
  <style>
    .paddedDiv {
      margin: 20px
    }

    .leftPaddedDiv {
      margin-left: 40px
    }
  </style>
</head>

<body>
  <div style="font-size:20px; padding:5px">
    <h1>Generate text mappings files</h1>
    <div style="display:flex">
      <div style="flex-direction:column">
        <div class="paddedDiv">
          <label for="inputFileSelector">Select an input Excel (.xlsx) file from which Archivist text mapping files will
            be generated.</label>
        </div>
        <div class="paddedDiv" style="display:flex;flex-direction:row">
          <input id="inputFileSelector" type="file" />
          <div style="margin-left:20px" id="createMappingsButton"></div>
        </div>

      </div>

    </div>
    <div class="paddedDiv" id="fileLinks"></div>
    <div class="paddedDiv" id="downloadAllFiles"></div>
    <div class="paddedDiv" id="statusMessage"></div>
    <div class="leftPaddedDiv" id="statusMessageDetails"></div>
  </div>

  <script>

    var zip;

    function getUniqueArrayValues(arrayData) {
      return [...new Set(arrayData)]
    }

    function addLinkToNewDiv(linkURL, linkText, downloadedFilename, pageDivId) {

      const link = document.createElement("a");

      const div = document.createElement("div");

      div.id = pageDivId

      link.href = linkURL

      link.text = linkText

      link.download = downloadedFilename

      document.getElementById("fileLinks").appendChild(div)

      document.getElementById(pageDivId).appendChild(link)

    }

    function addLinkToExistingDiv(linkURL, linkText, downloadedFilename, divId, linkLabel) {

      const link = document.createElement("a");

      link.href = linkURL

      link.text = linkText

      link.download = downloadedFilename

      const labelDiv = document.createElement("div");

      labelDiv.id = `${divId}-label`

      labelDiv.innerHTML = linkLabel

      const linkDiv = document.createElement("div");

      linkDiv.id = `${divId}-link`

      linkDiv.setAttribute("class", "paddedDiv")

      linkDiv.appendChild(link)

      document.getElementById(divId).appendChild(labelDiv)

      document.getElementById(divId).appendChild(linkDiv)

    }

    function columnNamesToLowerCase(worksheetDataByRows) {

      const rowValues = []

      worksheetDataByRows.forEach(worksheetRow => {

        // We need to create a new object to hold the row data so we can ensure the
        // field names of the object are all lower case...

        var rowData = {}

        Object.keys(worksheetRow).forEach(
          fieldName => rowData[fieldName.trim().toLowerCase()] = worksheetRow[fieldName])

        rowValues.push(rowData)

      })

      return rowValues

    }

    function createBlobURL(worksheetDataByRows, columns, fileName, suffix = {}) {

      console.log(fileName)  

      var fileData = ""

      var valueSpecifiedForAtLeastOneRow=[]

      columnsInWorkSheet=[]
      worksheetDataByRows.forEach(row => Object.keys(row).forEach(key => {
            if (!columnsInWorkSheet.includes(key))
               columnsInWorkSheet.push(key)
            }
          ))
      columnsMissingForMappings=columns.filter(
            item => !columnsInWorkSheet.includes(item))   
      
      console.log(columns)
      console.log(columnsInWorkSheet)      
      console.log(columnsMissingForMappings)

      //!columnsMissingForMappings.length && 
      worksheetDataByRows.forEach(worksheetRow => {

        const rowValues = []

        columns.forEach(columnName => {
          rowValues.push(worksheetRow[columnName.toLowerCase()]
             + (!!suffix[columnName] ? suffix[columnName] : ""))
            console.log(columnName) 
            console.log(worksheetRow[columnName.toLowerCase()])
            if (!["n/a", "na", "derived", "undefined", ""].includes(String(worksheetRow[columnName.toLowerCase()]))
                && !valueSpecifiedForAtLeastOneRow.includes(columnName))
                valueSpecifiedForAtLeastOneRow.push(columnName)
        })

        const lowerCaseRowValues = rowValues.map(rowValue => rowValue.trim().toLowerCase())

        if (!(lowerCaseRowValues.includes("n/a") 
        || lowerCaseRowValues.includes("na") 
        || lowerCaseRowValues.includes("derived") 
        || lowerCaseRowValues.includes("undefined")
        || lowerCaseRowValues.includes(""))) {
          fileData = fileData + rowValues.join("\t") + "\n"
        }    
      })

      var formBlob = new Blob([fileData], { type: 'text/plain' });

      if (formBlob.size > 0)

          zip.file(fileName, fileData);

      const downloadLink = window.URL.createObjectURL(formBlob);

      console.log(valueSpecifiedForAtLeastOneRow)

      const columnsWithNoValues = columns.filter(y => 
         !columnsMissingForMappings.includes(y)).filter(
            x => !valueSpecifiedForAtLeastOneRow.includes(x))

      var returnObject = {}

      console.log(!columnsMissingForMappings.length)
       
      if (!!columnsMissingForMappings.length)
      
             returnObject["columnsMissing"] = columnsMissingForMappings

      if (!!columnsWithNoValues.length)

             returnObject["columnsWithNoData"] = columnsWithNoValues

     console.log(formBlob.size > 0)
     console.log(returnObject)

      return formBlob.size > 0 ? {"downloadLink": downloadLink} : returnObject

    }

    const inputElement = document.getElementById("inputFileSelector");

    inputElement.addEventListener("change", addConvertButton, false);

    function addConvertButton() {

      const fileList = this.files;

      const createMappingsButtonDiv = document.getElementById("createMappingsButton");

      const createMappingsButtonObject = document.createElement("button");

      createMappingsButtonObject.textContent = "Create mappings"

      createMappingsButtonObject.setAttribute('aria-label', 'Create mapping files')

      createMappingsButtonObject.addEventListener("click", () => handleFiles(fileList), false);

      createMappingsButtonDiv.innerHTML = ""

      document.getElementById("fileLinks").innerHTML = ""

      document.getElementById("downloadAllFiles").innerHTML = ""

      document.getElementById("statusMessage").textContent = ""

      document.getElementById("statusMessageDetails").textContent = ""

      zip = new JSZip();

      createMappingsButtonDiv.appendChild(createMappingsButtonObject)

    }

    function handleFiles(fileList) {

      const reader = new FileReader()

      reader.onload = (function (event) {

        document.getElementById("fileLinks").innerHTML = ""

        document.getElementById("downloadAllFiles").innerHTML = ""

        try {

          const workBook = XLSX.read(reader.result, { nullError: true })['Sheets'];

          // Get QV and TV mappings worksheet...

          const qvTvWorksheet = workBook[Object.keys(workBook).find(key => key.toLowerCase() === 'qv and tv mappings')]

          var qvLinkURL;
          var tvLinkURL;
          var tqLinkURL;

          const qvTvWorksheetOrderedByRows = columnNamesToLowerCase(
            XLSX.utils.sheet_to_json(qvTvWorksheet, { defval: "" }))

          var qvTvDatasetPrefixes = (getUniqueArrayValues(qvTvWorksheetOrderedByRows.map(
            worksheetRow => worksheetRow['dataset prefix']).filter(datasetPrefixCell =>
               (!!datasetPrefixCell && !(datasetPrefixCell.toLowerCase().includes("n/a") 
               || datasetPrefixCell.toLowerCase().includes("na") 
               || datasetPrefixCell.toLowerCase().includes("derived") || !datasetPrefixCell.trim()))
           )))
           
          if (!qvTvDatasetPrefixes.length) {
            tvLinkURL = {
              "columnsWithNoData": ["dataset prefix"]
            }
          }

          var qvTvQuestionnairePrefixes = (getUniqueArrayValues(qvTvWorksheetOrderedByRows.map(
             worksheetRow => worksheetRow['questionnaire prefix']).filter(questionnairePrefixCell =>
               (!!questionnairePrefixCell && !(questionnairePrefixCell.toLowerCase().includes("n/a") 
               || questionnairePrefixCell.toLowerCase().includes("na") 
               || questionnairePrefixCell.toLowerCase().includes("derived") || !questionnairePrefixCell.trim()))
           )))

          if (!qvTvQuestionnairePrefixes.length) {
            tqLinkURL = qvLinkURL = {
               "columnsWithNoData": ["questionnaire prefix"]
            }
          }
          
          columnNamesQvTvWorksheet=[]

          qvTvWorksheetOrderedByRows.forEach(row => Object.keys(row).forEach(key => {
            if (!columnNamesQvTvWorksheet.includes(key))
               columnNamesQvTvWorksheet.push(key)
            }
          ))

          columnsRequiredForQvMappings = ['questionnaire prefix', 'question name (from questions)', 
             'dataset prefix', 'variable name']

          columnsRequiredForTvMappings = ['dataset prefix', 'variable name', 'topic id']

          columnsRequiredForTqMappings = ['questionnaire prefix', 'question name (from questions)', 
             'topic id']

          columnsRequiredForDvMappings = ["derived dataset prefix", "derived variable name",
              "source dataset prefix", "source variable name"
            ]
/*
          columnsMissingForQvMappings = columnsRequiredForQvMappings.filter(
            item => !columnNamesQvTvWorksheet.includes(item));

          columnsMissingForTvMappings = columnsRequiredForTvMappings.filter(
            item => !columnNamesQvTvWorksheet.includes(item));

          columnsMissingForTqMappings = columnsRequiredForTqMappings.filter(
            item => !columnNamesQvTvWorksheet.includes(item));
*/
          qvTvDatasetPrefixes.forEach(datasetPrefix => {

            tvLinkURL = createBlobURL(qvTvWorksheetOrderedByRows.filter(
              worksheetRow => worksheetRow['dataset prefix'] == datasetPrefix),
              columnsRequiredForTvMappings,
              `${datasetPrefix}_tv.txt`)

            !!tvLinkURL['downloadLink'] && addLinkToNewDiv(tvLinkURL,
              `${datasetPrefix}_tv.txt`,
              `${datasetPrefix}_tv.txt`,
              `tv${datasetPrefix.replaceAll("_", "-")}`)

          })
        
          simplifiedData = []

          qvTvWorksheetOrderedByRows.forEach(worksheetRow => {
            if (worksheetRow['question name (from questions)']?.includes("$")) {
              indexOfDollarSign = worksheetRow['question name (from questions)'].indexOf("$")
              worksheetRow['question name (from questions)'] = (worksheetRow['question name (from questions)'].slice(0, indexOfDollarSign))

            }
            if (simplifiedData.filter(dataRow => 
               dataRow['question name (from questions)'] == worksheetRow['question name (from questions)']
                 && dataRow['topic id'] == worksheetRow['topic id']).length == 0)
              simplifiedData.push(worksheetRow)
          })

          qvTvQuestionnairePrefixes.forEach(questionnairePrefix => {
  
            tqLinkURL = createBlobURL(simplifiedData.filter(
              dataRow => dataRow['questionnaire prefix'] == questionnairePrefix),
              columnsRequiredForTqMappings,
              `${questionnairePrefix}_tq.txt`,
              { 'questionnaire prefix': '_ccs01' })

            !!tqLinkURL['downloadLink'] && addLinkToNewDiv(tqLinkURL,
              `${questionnairePrefix}_tq.txt`,
              `${questionnairePrefix}_tq.txt`,
              `tq${questionnairePrefix.replaceAll("_", "-")}`)
          
            qvLinkURL = createBlobURL(
              qvTvWorksheetOrderedByRows.filter(worksheetRow => 
                  worksheetRow['questionnaire prefix'] == questionnairePrefix),
              columnsRequiredForQvMappings,
              `${questionnairePrefix}_qv.txt`,
              { 'questionnaire prefix': '_ccs01' })

            !!qvLinkURL['downloadLink'] && addLinkToNewDiv(qvLinkURL,
              `${questionnairePrefix}_qv.txt`,
              `${questionnairePrefix}_qv.txt`,
              `qv${questionnairePrefix.replaceAll("_", "-")}`)

          })

          console.log(qvLinkURL)

          // Get DV mappings worksheet...

          const dvWorksheet = workBook[Object.keys(workBook).find(key => key.toLowerCase() === 'dv')]

          const dvWorksheetOrderedByRows = columnNamesToLowerCase(
            XLSX.utils.sheet_to_json(dvWorksheet, { defval: "" }))

          columnNamesDvWorksheet=[]

          dvWorksheetOrderedByRows.forEach(row => Object.keys(row).forEach(key => {
            if (!columnNamesDvWorksheet.includes(key))
               columnNamesDvWorksheet.push(key)
            }
          ))
/*
          columnsMissingForDvMappings = columnsRequiredForDvMappings.filter(
            item => !columnNamesDvWorksheet.includes(item));
*/
          var dvLinkURL;
  
          dvDatasetPrefixes = (getUniqueArrayValues(dvWorksheetOrderedByRows.map(
              worksheetRow => worksheetRow['derived dataset prefix']).filter(datasetPrefixCell =>
              (!!datasetPrefixCell
                && !(datasetPrefixCell.toLowerCase().includes("n/a")
                  || datasetPrefixCell.toLowerCase().includes("na")
                  || datasetPrefixCell.toLowerCase().includes("derived") || !datasetPrefixCell.trim()))
              )))
          
          if (!dvDatasetPrefixes.length) {
            dvLinkURL = {
              "columnsWithNoData": ["dataset prefix"]
            }
          }

            dvDatasetPrefixes.forEach(datasetPrefix => {
              dvLinkURL = createBlobURL(dvWorksheetOrderedByRows.filter(
                worksheetRow => worksheetRow['derived dataset prefix'] == datasetPrefix),
                columnsRequiredForDvMappings,
                `${datasetPrefix}_dv.txt`)

              !!dvLinkURL['downloadLink'] && addLinkToNewDiv(dvLinkURL,
                `${datasetPrefix}_dv.txt`,
                `${datasetPrefix}_dv.txt`,
                `dv${datasetPrefix.replaceAll("_", "-")}`)

            })
          
        
        /*
        if (!qvLinkURL?.['downloadLink'] 
            || !tvLinkURL?.['downloadLink'] 
            || !tqLinkURL?.['downloadLink'] 
            || !dvLinkURL?.['downloadLink'])

            document.getElementById("statusMessage").innerHTML += `Please check that uploaded input has a valid structure`
*/
        console.log(qvLinkURL)

        if (!qvLinkURL?.['downloadLink']) {

            causesForErrorQvFile = ""
        
            if (!!qvLinkURL?.['columnsWithNoData']) causesForErrorQvFile += `<li>There were no values for
               the following columns in the input worksheet, check that the column(s) exist in the
                 'QV and TV mappings' worksheet and contain data: <ul>${qvLinkURL['columnsWithNoData'].map(
                 column =>  "<li>"+ column +"</li>").join("")}</ul></li>`      
            if (!!qvLinkURL?.['columnsMissing'])
               causesForErrorQvFile += `<li>The following columns were missing from the input 
                  file: ${qvLinkURL['columnsMissing']}</li>`
              
            document.getElementById("statusMessageDetails").innerHTML += `- Unable to create qv mappings file for 
               the following reasons:<ol>${causesForErrorQvFile}</ol>`
        }  
          
        
        if (!tvLinkURL?.['downloadLink']) {

            causesForErrorTvFile = ""

            if (!!tvLinkURL?.['columnsWithNoData']) causesForErrorTvFile += `<li>There were no values for
               the following columns in the input worksheet, check that the column(s) exist in the
                 'QV and TV mappings' worksheet and contain data: <ul>${tvLinkURL['columnsWithNoData'].map(
                 column =>  "<li>"+ column +"</li>").join("")}</ul></li>`      
            if (!!tvLinkURL?.['columnsMissing'])
               causesForErrorTvFile += `<li>The following columns were missing from the input 
                  file: ${tvLinkURL['columnsMissing']}</li>`
            
            document.getElementById("statusMessageDetails").innerHTML += `- Unable to create tv mappings
                file. <ol>${causesForErrorTvFile}</ol>`
        }

        if (!tqLinkURL?.['downloadLink'])  {
          
            causesForErrorTqFile=""
           
            if (!!tqLinkURL?.['columnsWithNoData']) causesForErrorTqFile += `<li>There were no values for
               the following columns in the input worksheet, check that the column(s) exist in the
                 'QV and TV mappings' worksheet and contain data: <ul>${tqLinkURL['columnsWithNoData'].map(
                 column =>  "<li>"+ column +"</li>")}</ul></li>` 
            if (!!tqLinkURL?.['columnsMissing'])
               causesForErrorTqFile += `<li>The following columns were missing from the input 
                 file: ${tqLinkURL['columnsMissing']}</li>`
                
            document.getElementById("statusMessageDetails").innerHTML += `- Unable to create tq mappings 
               file for the following reasons: <ol>${causesForErrorTqFile}</ol>`
        }

        if (!dvLinkURL?.['downloadLink'])  {
            
            causesForErrorDvFile = ""

            if (!!dvLinkURL?.['columnsWithNoData']) causesForErrorDvFile += `<li>There were no values for
               the following columns in the input worksheet, check that the column(s) exist in the
                 'DV' worksheet and contain data: <ul>${dvLinkURL['columnsWithNoData'].map(
                 column =>  "<li>"+ column +"</li>").join("")}</ul></li>`   
            if (!!dvLinkURL?.['columnsMissing'])
               causesForErrorDvFile += `<li>The following columns were missing from the input 
                 file: ${dvLinkURL['columnsMissing']}</li>`
            
            document.getElementById("statusMessageDetails").innerHTML += `- Unable to create dv mappings 
            file for the following reasons: <ol>${causesForErrorDvFile}</ol>` 
        }
            
        } catch (error) {
          document.getElementById("statusMessage").innerHTML = `Error processing selected input file. Error generated
        by application: ${error}
        <p>
        Check that the file is correctly formatted, see <a target="_blank" href="https://github.com/CLOSER-Cohorts/archivist-utilities/blob/main/README.md">
          https://github.com/CLOSER-Cohorts/archivist-utilities/blob/main/README.md
          </a> for instructions on the required format for the input file.
        `
        }

        if (Object.keys(zip.files).length > 0) {
          zip.generateAsync({ type: "blob" })
            .then(function (content) {
              const downloadLink = window.URL.createObjectURL(content);
              addLinkToExistingDiv(downloadLink,
                "allMappings.zip",
                "allMappings.zip",
                "downloadAllFiles",
                "Click the link below to download all the generated mapping files.")
          });
        }

        else {

          document.getElementById("downloadAllFiles")
            .innerHTML = "Insufficient data in input spreadsheet to generate any mapping files."
          
        }

      })

      reader.readAsArrayBuffer(fileList[0])

    }

  </script>

</body>

</html>
